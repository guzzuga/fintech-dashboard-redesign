<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinanceAI — Login</title>
<link rel="icon" type="image/jpeg" href="/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #06080F;
    --surface: rgba(13,18,32,0.85);
    --card: rgba(17,24,39,0.6);
    --primary: #6366F1;
    --success: #22C55E;
    --danger: #EF4444;
    --info: #3B82F6;
    --text: #F1F5F9;
    --muted: #94A3B8;
    --border: rgba(255, 255, 255, 0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(59,130,246,0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  .login-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: rgba(17, 24, 39, 0.5);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .logo {
    width: 48px; height: 48px;
    border-radius: 14px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; }
  .brand p { font-size: 12px; color: var(--muted); letter-spacing: 0.01em; }

  .head { margin-bottom: 24px; }
  .head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; }
  .head span { font-size: 13px; color: var(--muted); }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px; font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .input-box { position: relative; }
  .input-box input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-box input::placeholder { color: #4b5563; }
  .input-box input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
  }
  .toggle-pass {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12px;
    transition: color 0.2s, background 0.2s;
  }
  .toggle-pass:hover { color: var(--text); background: rgba(255,255,255,0.05); }

  .submit-btn {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 14px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 6px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
  }
  .submit-btn:hover:not(:disabled) { background: #818cf8; transform: translateY(-1px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4); }
  .submit-btn:active:not(:disabled) { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .foot { text-align: center; margin-top: 22px; font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }

  .toast-zone {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex; flex-direction: column; gap: 10px;
    width: calc(100% - 40px);
    max-width: 380px;
  }
  .toast {
    display: flex; align-items: center; gap: 12px;
    background: rgba(17,24,39,0.8);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    animation: toastIn 0.35s cubic-bezier(0.16,1,0.3,1);
  }
  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--danger); }
  .toast .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--primary); }
  .toast.success .dot { background: var(--success); }
  .toast.error .dot { background: var(--danger); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  .toast.hide { animation: toastOut 0.3s forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-16px); } }

  @media (max-width: 480px) {
    .card { padding: 32px 22px; }
  }
</style>
</head>
<body>
  <div class="toast-zone" id="toastZone"></div>

  <div class="login-wrap">
    <div class="card">
      <div class="brand">
        <div class="logo">
          <img src="/logo.jpg" alt="FinanceAI" />
        </div>
        <div>
          <h1>FinanceAI</h1>
          <p>Garment Business Suite</p>
        </div>
      </div>

      <div class="head">
        <h2>Selamat datang kembali</h2>
        <span>Masuk untuk mengakses dashboard Anda.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <div class="input-box">
            <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-box">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">Show</button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnLabel">Masuk</span>
        </button>
      </form>

      <div class="foot">Demo login &middot; username <b>admin</b> &middot; password <b>admin123</b></div>
    </div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const btnLabel = document.getElementById('btnLabel');
  const toggle = document.getElementById('togglePass');
  const passInput = document.getElementById('password');
  const toastZone = document.getElementById('toastZone');

  function toast(message, type = 'info') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = '<span class="dot"></span><span>' + message + '</span>';
    toastZone.appendChild(el);
    setTimeout(() => {
      el.classList.add('hide');
      setTimeout(() => el.remove(), 300);
    }, 3500);
  }

  toggle.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    toggle.textContent = isPass ? 'Hide' : 'Show';
    passInput.focus();
  });

  function setLoading(state) {
    submitBtn.disabled = state;
    spinner.style.display = state ? 'block' : 'none';
    btnLabel.textContent = state ? 'Memproses...' : 'Masuk';
  }

  (async function checkSession() {
    try {
      const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
      if (res.ok) {
        const data = await res.json();
        if (data && data.authenticated) window.location.href = '/index.html';
      }
    } catch (_) { }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = passInput.value;

    if (!username || !password) {
      toast('Username dan password wajib diisi.', 'error');
      return;
    }

    setLoading(true);
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        toast('Login berhasil! Mengalihkan...', 'success');
        setTimeout(() => { window.location.href = '/index.html'; }, 700);
      } else {
        let msg = 'Username atau password salah.';
        try { const d = await res.json(); if (d && d.detail) msg = d.detail; } catch (_) {}
        toast(msg, 'error');
        setLoading(false);
      }
    } catch (err) {
      toast('Tidak dapat terhubung ke server.', 'error');
      setLoading(false);
    }
  });
</script>
</body>
</html>
